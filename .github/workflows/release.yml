name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Pack the release tarball
        run: |
          mkdir -p release/ashby-plugin
          cp -R dist skills assets package.json README.md LICENSE release/ashby-plugin/
          tar -czf "ashby-plugin-${VERSION}.tar.gz" -C release ashby-plugin
          sha256sum "ashby-plugin-${VERSION}.tar.gz" > SHA256SUMS
      - name: Conformance report
        run: npx plugin-kit conformance --json > conformance.json
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes "ashby-plugin-${VERSION}.tar.gz" SHA256SUMS conformance.json
