name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Pack the release tarball
        run: |
          mkdir -p release/ashby-plugin
          cp -R dist skills assets package.json README.md LICENSE release/ashby-plugin/
          tar -czf "ashby-plugin-${VERSION}.tar.gz" -C release ashby-plugin
          sha256sum "ashby-plugin-${VERSION}.tar.gz" > SHA256SUMS
      - name: Conformance report
        run: npx plugin-kit conformance --json > conformance.json
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes "ashby-plugin-${VERSION}.tar.gz" SHA256SUMS conformance.json
