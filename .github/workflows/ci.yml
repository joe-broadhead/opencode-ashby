name: ci

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    # A public repository: the job runs on the org's `boxd-public` runner, named directly. A pull request from a fork
    # waits for approval before it runs.
    runs-on: boxd-public
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Fetch the contract over HTTPS
        # The contract is a public repository, and npm records its GitHub dependency over ssh. A runner has no key.
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - run: npm ci --ignore-scripts
      - name: Bundle and check dist/
        run: npm run bundle && git diff --exit-code dist/
      - run: npm run check
