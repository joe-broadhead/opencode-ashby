name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: ci
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (vars.CI_RUNNER_PUBLIC || 'ubuntu-24.04') || 'ubuntu-24.04' }}
    # The release kit's CI rule (pinned in scripts/release-kit.test.mjs) still reads a gated runner matrix, while the
    # rebuild runs the whole check once on the public runner. Its entries stay parseable; every step runs only for the
    # ubuntu entry, so a push or a pull request performs exactly one full check. plugin-kit removes this in 4b.
    strategy:
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04","ubuntu-24.04-arm"]' || '["ubuntu-24.04","ubuntu-24.04-arm","macos-26"]') }}
    timeout-minutes: 20
    steps:
      - if: matrix.os == 'ubuntu-24.04'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: matrix.os == 'ubuntu-24.04'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # Caches ~/.npm per OS and architecture. The host and pack stages install @opencode/sdk and the stock
          # @opencode/cli for each release in TESTED_HOSTS (src/constants.ts: 2.4.1) through npm, so that file is part
          # of the key.
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src/constants.ts
      - if: matrix.os == 'ubuntu-24.04'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      - if: matrix.os == 'ubuntu-24.04'
        run: npm ci --ignore-scripts
      - if: matrix.os == 'ubuntu-24.04'
        run: npm run check
